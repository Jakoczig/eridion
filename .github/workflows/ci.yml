name: ERIDION legacy compatibility CI

# main still contains the inherited application. Native Go/Wails checks live
# on the native development stack; this workflow does not claim native coverage.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  GO_VERSION: '1.26.10'

jobs:
  lint:
    name: Legacy JavaScript lint (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --loglevel=error
      - name: Report inherited lint findings without blocking the build
        run: npx --no-install standard "src/**/*.js"

  build-client:
    name: Shared client build and package metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check package and lockfile root metadata
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          const root = lock.packages['']
          for (const key of ['name', 'version']) assert.equal(lock[key], pkg[key], `lockfile ${key}`)
          for (const key of ['name', 'version', 'license', 'engines', 'dependencies', 'devDependencies']) {
            assert.deepEqual(root[key], pkg[key], `lockfile root ${key}`)
          }
          console.log('Package and lockfile root metadata agree.')
          NODE
      - run: npm ci --loglevel=error
      - name: Cache Next.js build work
        uses: actions/cache@v4
        with:
          path: src/client/.next/cache
          key: nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/client/**/*.js', 'src/client/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:client

  build-app:
    name: Legacy Windows wrapper build and startup check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/app/go.sum
      - name: Compile the legacy Windows wrapper
        run: |
          Set-Location src/app
          go build -ldflags="-H windowsgui -s -w" -o ../../build/test-app.exe
      - name: Check the legacy wrapper starts
        run: .\build\test-app.exe --smoke-test
